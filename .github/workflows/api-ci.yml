name: API CI

on:
  push:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-ci.yml"]
  pull_request:
    branches: [main]
    paths: ["api/**", ".github/workflows/api-ci.yml"]

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/api
    env:
      JWT_SECRET: ci-test-jwt-secret-for-github-actions-must-be-at-least-32-chars

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - run: ./mvnw --no-transfer-progress spotless:check -q

      - run: ./mvnw --no-transfer-progress checkstyle:check -q

      - run: ./mvnw --no-transfer-progress spotbugs:check -q

      - run: ./mvnw --no-transfer-progress pmd:check -q

      - run: ./mvnw --no-transfer-progress compile -q

      - run: ./mvnw --no-transfer-progress test
