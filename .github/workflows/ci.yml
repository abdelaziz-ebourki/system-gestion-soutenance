name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - run: ./mvnw --no-transfer-progress spotless:check -q

      - run: ./mvnw --no-transfer-progress checkstyle:check -q

      - run: ./mvnw --no-transfer-progress spotbugs:check -q

      - run: ./mvnw --no-transfer-progress pmd:check

      - run: ./mvnw --no-transfer-progress compile -q

      - run: ./mvnw --no-transfer-progress test
