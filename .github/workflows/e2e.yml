name: E2E Tests

on:
  push:
    branches: [main]
    paths: ["api/**", "ui/**", "e2e/**", ".github/workflows/e2e.yml"]
  pull_request:
    branches: [main]
    paths: ["api/**", "ui/**", "e2e/**", ".github/workflows/e2e.yml"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  API_URL: http://localhost:8080
  UI_URL: http://localhost:5173

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: defensedb
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      mailpit:
        image: axllent/mailpit:v1.27.0
        ports:
          - 1025:1025
          - 8025:8025
        options: >-
          --health-cmd="wget -qO- http://localhost:8025/api/v1/info || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          cache-dependency-path: api/pom.xml

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            e2e/package-lock.json

      - name: Build API
        working-directory: api
        env:
          JWT_SECRET: ci-e2e-jwt-secret-must-be-at-least-32-chars-long
        run: ./mvnw -q package -DskipTests -Dspring.profiles.active=test

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Typecheck e2e suite
        working-directory: e2e
        run: npx tsc --noEmit

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Start API
        working-directory: api
        env:
          SPRING_PROFILES_ACTIVE: prod
          DDL_AUTO: update
          DB_HOST: localhost
          DB_PORT: 3306
          DB_NAME: defensedb
          DB_USERNAME: e2e
          DB_PASSWORD: e2e_secret
          JWT_SECRET: ci-e2e-jwt-secret-must-be-at-least-32-chars-long
          SMTP_HOST: localhost
          SMTP_PORT: 1025
          SMTP_AUTH: false
          SMTP_STARTTLS: false
          MAIL_FROM: noreply@example.com
          CORS_ORIGINS: http://localhost:5173
        run: |
          java -jar target/*.jar --spring.profiles.active=prod > "$GITHUB_WORKSPACE/e2e-api.log" 2>&1 &
          echo "Waiting for API to be ready (seed can take minutes on slow runners)..."
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null || echo "000")
            echo "Attempt $i: status=$status"
            if [ "$status" = "200" ]; then
              echo "API is ready (attempt $i)"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "API failed to start within timeout — tail of e2e-api.log:"
              tail -n 60 "$GITHUB_WORKSPACE/e2e-api.log" || true
              exit 1
            fi
            sleep 5
          done
          echo "Asserting seed login works..."
          login_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@univh2c.ma","password":"1234"}')
          if [ "$login_status" != "200" ]; then
            echo "Seed login failed with status=$login_status — tail of e2e-api.log:"
            tail -n 60 "$GITHUB_WORKSPACE/e2e-api.log" || true
            exit 1
          fi
          echo "Seed login OK"

      - name: Start UI preview
        run: |
          npx --yes serve@14 -s -l 5173 ui/dist &
          echo "Waiting for UI to be ready..."
          for i in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "UI is ready (attempt $i)"
              break
            fi
            if [ "$i" = "15" ]; then
              echo "UI failed to start within timeout"
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
