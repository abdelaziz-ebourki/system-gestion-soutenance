name: E2E Tests

on:
  push:
    branches: [main]
    paths: ["api/**", "ui/**", "e2e/**", ".github/workflows/e2e.yml"]
  pull_request:
    branches: [main]
    paths: ["api/**", "ui/**", "e2e/**", ".github/workflows/e2e.yml"]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  API_URL: http://localhost:8080
  UI_URL: http://localhost:5173

jobs:
  e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: defensedb
          MYSQL_USER: e2e
          MYSQL_PASSWORD: e2e_secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven
          cache-dependency-path: api/api/pom.xml

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            e2e/package-lock.json

      - name: Build API
        working-directory: api/api
        env:
          JWT_SECRET: ci-e2e-jwt-secret-must-be-at-least-32-chars-long
        run: ./mvnw -q package -DskipTests -Dspring.profiles.active=test

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI
        working-directory: ui
        run: npm run build

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install chromium --with-deps

      - name: Start API
        working-directory: api/api
        env:
          SPRING_PROFILES_ACTIVE: test
          JWT_SECRET: ci-e2e-jwt-secret-must-be-at-least-32-chars-long
        run: |
          java -jar target/*.jar --spring.profiles.active=test &
          echo "Waiting for API to be ready..."
          for i in $(seq 1 60); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/actuator/health 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "API is ready (attempt $i)"
              break
            fi
            if [ "$i" = "60" ]; then
              echo "API failed to start within timeout"
              exit 1
            fi
            sleep 2
          done

      - name: Start UI preview
        run: |
          npx --yes serve@14 -s -l 5173 ui/dist &
          echo "Waiting for UI to be ready..."
          for i in $(seq 1 15); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5173 2>/dev/null || echo "000")
            if [ "$status" = "200" ]; then
              echo "UI is ready (attempt $i)"
              break
            fi
            if [ "$i" = "15" ]; then
              echo "UI failed to start within timeout"
              exit 1
            fi
            sleep 2
          done

      - name: Run Playwright tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: e2e/test-results/
          retention-days: 7
