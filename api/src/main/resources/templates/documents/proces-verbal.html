<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8"/>
<title>Procès-Verbal</title>
<style>
  @page { margin: 2cm; size: A4; }
  body { font-family: 'DejaVu Sans', sans-serif; font-size: 10pt; line-height: 1.5; color: #222; }
  .header { text-align: center; margin-bottom: 1.5em; }
  .header h1 { font-size: 14pt; margin-bottom: 0.3em; text-transform: uppercase; }
  .header .institution { font-size: 12pt; font-weight: bold; }
  .title { text-align: center; font-weight: bold; font-size: 13pt; margin: 1em 0; text-decoration: underline; }
  .info-table { width: 100%; border-collapse: collapse; margin-bottom: 1.5em; }
  .info-table td { padding: 0.3em 0.5em; border: 1px solid #222; }
  .info-table td:first-child { width: 30%; font-weight: bold; background: #f0f0f0; }
  .jury-table { width: 100%; border-collapse: collapse; margin-bottom: 1.5em; }
  .jury-table th { background: #222; color: #fff; padding: 0.4em 0.5em; text-align: left; font-size: 10pt; }
  .jury-table td { padding: 0.4em 0.5em; border-bottom: 1px solid #ccc; }
  .result-section { margin-top: 2em; }
  .result-box { border: 2px solid #222; padding: 1em; text-align: center; margin: 1em 0; }
  .result-box .label { font-weight: bold; font-size: 11pt; }
  .result-box .value { font-size: 14pt; font-weight: bold; margin-top: 0.3em; }
  .signature-section { margin-top: 3em; }
  .signature-line { display: inline-block; margin-top: 1em; width: 200px; border-top: 1px solid #222; padding-top: 0.3em; text-align: center; font-size: 9pt; margin-right: 3em; }
  .observations { margin-top: 1.5em; }
  .observations .line { border-bottom: 1px solid #ccc; height: 1.5em; margin-bottom: 0.3em; }
</style>
</head>
<body>
  <div class="header">
    <div class="institution" th:text="${settings.institutionName} ?: 'Université'">Université</div>
    <h1>Procès-Verbal de Soutenance</h1>
  </div>

  <div class="title" th:text="'Projet : ' + ${grade.projectTitle}">Projet : Titre</div>

  <table class="info-table">
    <tr><td>Étudiants</td><td th:text="${#strings.listJoin(studentNames, ', ')}">Dupont, Martin</td></tr>
    <tr><td>Encadrant</td><td th:text="${supervisorName} ?: '—'">M. Dupont</td></tr>
  </table>

  <h3>Membres du Jury</h3>
  <table class="jury-table">
    <thead><tr><th>Rôle</th><th>Nom</th></tr></thead>
    <tbody>
      <tr th:each="member : ${juryMembers}">
        <td th:text="${member.roleName}">Président</td>
        <td th:text="${member.teacherName}">M. Dupont</td>
      </tr>
    </tbody>
  </table>

  <div class="result-section">
    <h3>Résultat</h3>
    <div class="result-box">
      <div class="label">Note Finale</div>
      <div class="value" th:text="${grade.finalScore + '/20'}">15/20</div>
    </div>
    <div class="result-box">
      <div class="label">Décision</div>
      <div class="value" th:text="${grade.decision}">Admis(e)</div>
    </div>
  </div>

  <div class="observations">
    <h3>Observations</h3>
    <div class="line"></div>
    <div class="line"></div>
    <div class="line"></div>
  </div>

  <div class="signature-section">
    <div class="signature-line">Le Président du Jury</div>
    <div class="signature-line">Les Membres</div>
  </div>
</body>
</html>
