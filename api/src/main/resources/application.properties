spring.application.name=api

spring.datasource.url=jdbc:h2:mem:defensedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=true

spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# UI base URL for building verification/reset links
app.ui.base-url=http://localhost:5173
app.jwt.secret=${JWT_SECRET:dev-only-secret-do-not-use-in-production-replace-with-256-bit-key}

# Comma-separated list of allowed CORS origins
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

# Email Configuration — disabled by default (mock mode logs emails)
# Set SMTP env vars to enable real email delivery in production
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

# Sender address for outgoing emails
app.mail.from=${MAIL_FROM:noreply@example.com}

# Institution info (used in PDF documents)
app.institution.name=${INSTITUTION_NAME:Université Hassan II}
app.institution.logo-url=${INSTITUTION_LOGO_URL:}
logging.level.com.system_gestion_soutenance=DEBUG
app.security.rate-limit.max-requests=50


